name: Update data and deploy Pages

on:
  push:
    branches: [ main ]

  # DOC and Newbook every quarter hour, Auckland Council only on the hour: its gateway is
  # slow and its site asks not to be scraped hard. The Fetch step tells them apart by
  # github.event.schedule, so the two strings must match the ones there.
  #
  # GitHub runs these only now and then (3 of ~48 on 2026-10-06), so cron-job.org drives
  # the real cadence through workflow_dispatch below, every source every 15 minutes;
  # these stay as a fallback.
  schedule:
    - cron: "0 * * * *"
    - cron: "15,30,45 * * * *"

  # Called by cron-job.org every 15 minutes with no inputs, i.e. every source. "sources"
  # narrows a run, e.g. "doc,newbook" from the Actions tab.
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources to fetch (doc, akl, newbook); empty for all"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

# Queue rather than cancel: a run with Auckland Council takes 5-15 minutes, and the next
# quarter-hour run must not kill it halfway.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # A queued run would otherwise check out the commit it was queued on and then fail
      # to push over the data commit of the run it waited for.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch latest data
        run: |
          mkdir -p data.old
          cp data/*.json data.old/ 2>/dev/null || true
          node fetch.js
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SOURCES: ${{ inputs.sources || (github.event.schedule == '15,30,45 * * * *' && 'doc,newbook' || '') }}

      - name: Notify Telegram on freed dates
        if: ${{ !cancelled() }}
        run: node notify.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

      - name: Commit only if data changed
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet data/; then
            echo "No changes in data/"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update data.json"
            git push
          fi

      - name: Setup Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # The artifact store is eventually consistent: now and then deploy-pages asks for the
      # artifact just uploaded and is told there is none (2026-10-06 14:44). Rather than
      # fail the run and send an email, wait and deploy once more.
      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the deploy
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
