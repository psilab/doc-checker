<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hut Availability</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            max-width: 1600px;
            margin: 40px auto;
            text-align: center;
        }

        h1{
            margin-bottom: 20px;
        }

        .nav{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav button{
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 10px;
        }

        .nav button:hover{
            background: #eee;
            border-radius: 4px;
        }

        #navLabel{
            font-size: 18px;
            font-weight: bold;
            min-width: 140px;
        }

        .huts{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
        }

        .hut{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hut h2{
            margin-bottom: 10px;
        }

        .flatpickr-prev-month,
        .flatpickr-next-month,
        .flatpickr-current-month{
            display: none !important;
        }

        .flatpickr-day{
            cursor: default;
        }

        .available{
            background:#4CAF50 !important;
            color:white !important;
        }

        .low{
            background:#FF9800 !important;
            color:white !important;
        }

        .full{
            background:#F44336 !important;
            color:white !important;
        }

        .watched{
            outline: 4px solid #1565C0 !important;
            outline-offset: -4px;
        }

        #tip{
            position: absolute;
            display: none;
            background: #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre;
            pointer-events: none;
            z-index: 100;
        }

        .legend{
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .legend div{
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box{
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .green{background:#4CAF50}
        .orange{background:#FF9800}
        .red{background:#F44336}

    </style>
</head>

<body>

<h1>Hut Availability</h1>

<div class="nav">
    <button id="navPrev">&#8249;</button>
    <div id="navLabel"></div>
    <button id="navNext">&#8250;</button>
</div>

<div class="huts" id="huts"></div>

<div class="legend">
    <div><span class="box green"></span> plenty</div>
    <div><span class="box orange"></span> few left</div>
    <div><span class="box red"></span> full</div>
</div>

<script>

    const instances = [];

    // Share of capacity below which a hut counts as "few left".
    const LOW_RATIO = 1 / 3;
    const MONTHS = ["January","February","March","April","May","June",
                    "July","August","September","October","November","December"];

    // Auckland Council's own calendar renders these types as two-state, because they are
    // booked whole: their capacity is either zero or the entire place, never a partial
    // count the way a campground or a hut reports one.
    const WHOLE_UNIT_TYPES = ["Bach", "Tiny home", "Lodge", "Glamping", "Tent"];

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();

    function updateLabel() {
        document.getElementById("navLabel").textContent = MONTHS[currentMonth] + " " + currentYear;
    }

    function syncAll() {
        for (const fp of instances) {
            fp.changeYear(currentYear);
            fp.changeMonth(currentMonth, false);
        }
        updateLabel();
    }

    document.getElementById("navPrev").addEventListener("click", () => {
        currentMonth--;
        if (currentMonth < 0) { currentMonth = 11; currentYear--; }
        syncAll();
    });

    document.getElementById("navNext").addEventListener("click", () => {
        currentMonth++;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        syncAll();
    });

    function localDate(d) {
        return d.getFullYear() + "-" +
            String(d.getMonth() + 1).padStart(2, "0") + "-" +
            String(d.getDate()).padStart(2, "0");
    }

    // DOC ids and Auckland Council ids are separate number spaces, so AKL files carry a
    // prefix to keep them from ever colliding. Same helper lives in fetch.js and notify.js.
    function dataKey(hut) {
        return hut.source === "akl" ? `akl-${hut.id}` : String(hut.id);
    }

    // The two sources store different shapes, so flatten both to { date, free, max } per
    // night and let everything downstream stay source-agnostic. Also lives in notify.js.
    function daysOf(hut, json) {
        if (hut.source === "akl") {
            // Overbooked or closed days come back as a negative capacity. Nothing
            // downstream wants to reason about that, so it is just as unavailable as zero.
            return (json?.days ?? []).map(d => ({
                date: d.date,
                free: Math.max(0, d.capacity),
                max: json.maxCapacity
            }));
        }

        return Object.values(json?.Facility?.Dates ?? {}).map(d => ({
            date: d.Date,
            free: d.IsAvailable ? d.TotalAvailable : 0,
            max: d.MaxOccupancy
        }));
    }

    // A DOC hut or a campground with one bed left is no use to a party, so it reads as full.
    // For a whole-unit type any free space means the entire place is free.
    function minFree(hut) {
        return hut.source === "akl" && WHOLE_UNIT_TYPES.includes(hut.type) ? 1 : 2;
    }

    function loadHut(hut, container) {
        fetch(`./data/${dataKey(hut)}.json?t=` + Date.now())
            .then(r => r.json())
            .then(data => {

                const days = daysOf(hut, data);
                if (!days.length) return;

                const threshold = minFree(hut);
                const dateMap = {};

                for (const d of days){
                    dateMap[d.date] = d;
                }

                const cal = document.createElement("div");
                container.appendChild(cal);

                const fp = flatpickr(cal, {

                    inline: true,
                    locale: { firstDayOfWeek: 1 },

                    onDayCreate: function(dObj, dStr, fp, dayElem){

                        const date = localDate(dayElem.dateObj);
                        const d = dateMap[date];

                        if (d) {
                            dayElem.dataset.info = date + "\n" + d.free + " of " + d.max + " places free";

                            if (d.free < threshold){
                                dayElem.classList.add("full");
                            } else if (d.free < d.max * LOW_RATIO){
                                dayElem.classList.add("low");
                            } else {
                                dayElem.classList.add("available");
                            }
                        }

                        if (hut.watchDates.includes(date)){
                            dayElem.classList.add("watched");
                        }

                    }

                });

                fp.calendarContainer.addEventListener("click", e => e.stopPropagation(), true);
                fp.jumpToDate(new Date(currentYear, currentMonth, 1));
                instances.push(fp);

            });
    }

    const tip = document.createElement("div");
    tip.id = "tip";
    document.body.appendChild(tip);

    document.addEventListener("mouseover", e => {
        const day = e.target.closest(".flatpickr-day");
        if (!day || !day.dataset.info) {
            tip.style.display = "none";
            return;
        }
        tip.textContent = day.dataset.info;
        tip.style.display = "block";
        const r = day.getBoundingClientRect();
        tip.style.left = (window.scrollX + r.left + r.width / 2 - tip.offsetWidth / 2) + "px";
        tip.style.top = (window.scrollY + r.bottom + 8) + "px";
    });

    updateLabel();

    fetch("./config.json?t=" + Date.now())
        .then(r => r.json())
        .then(config => {
            const sorted = [...config.huts].sort((a, b) => a.name.localeCompare(b.name));
            for (const hut of sorted){
                const container = document.createElement("div");
                container.className = "hut";
                const title = document.createElement("h2");
                title.textContent = hut.name;
                container.appendChild(title);
                document.getElementById("huts").appendChild(container);
                loadHut(hut, container);
            }
        });

</script>

</body>
</html>
